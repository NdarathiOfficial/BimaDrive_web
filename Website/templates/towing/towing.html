{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Request Assistance</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: #0f172a; font-family: 'Poppins', sans-serif; margin: 0;
            display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden;
            background-image: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
        }

        .radar-container { position: absolute; width: 600px; height: 600px; display: flex; justify-content: center; align-items: center; z-index: 1; }
        .ring {
            position: absolute; border: 1px solid rgba(70, 187, 244, 0.3); border-radius: 50%;
            animation: ripple 3s infinite linear;
        }
        .r1 { width: 200px; height: 200px; animation-delay: 0s; }
        .r2 { width: 200px; height: 200px; animation-delay: 1s; }
        .r3 { width: 200px; height: 200px; animation-delay: 2s; }

        @keyframes ripple {
            0% { width: 200px; height: 200px; opacity: 1; border-width: 2px; }
            100% { width: 600px; height: 600px; opacity: 0; border-width: 0px; }
        }

        .glass-card {
            width: 450px; padding: 60px 40px; text-align: center;
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 32px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            position: relative; z-index: 10;
        }

        .icon-box {
            width: 80px; height: 80px; background: #46bbf4; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 36px; color: white;
            margin: 0 auto 30px; box-shadow: 0 0 30px #46bbf4;
        }

        h2 { color: white; margin: 0 0 10px; font-weight: 700; font-size: 28px; }
        p { color: rgba(255,255,255,0.6); font-size: 14px; margin-bottom: 40px; line-height: 1.6; }

        .location-input {
            width: 100%; padding: 18px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; color: white; text-align: center; font-size: 16px; margin-bottom: 25px;
            transition: 0.3s;
        }
        .location-input:focus { outline: none; border-color: #46bbf4; background: rgba(0,0,0,0.5); box-shadow: 0 0 15px rgba(70, 187, 244, 0.2); }

        .btn-sos {
            width: 100%; padding: 18px; background: linear-gradient(135deg, #46bbf4 0%, #4e37b5 100%);
            border: none; border-radius: 16px; color: white; font-weight: 700; font-size: 16px;
            cursor: pointer; box-shadow: 0 0 20px rgba(78, 55, 181, 0.4); transition: 0.3s;
        }
        .btn-sos:hover { transform: scale(1.02); box-shadow: 0 0 40px rgba(78, 55, 181, 0.6); }

        /* --- INACTIVITY TIMEOUT MODAL --- */
        #inactivityModal {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px);
            z-index: 99999; display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .inactivity-card { background: white; width: 100%; max-width: 420px; border-radius: 24px; padding: 40px; text-align: center; box-shadow: 0 25px 60px rgba(0,0,0,0.4); }
        .inactivity-card i { font-size: 48px; color: #f59e0b; display: block; margin-bottom: 15px; }
        .inactivity-card h2 { font-size: 22px; font-weight: 800; color: #1e293b; margin-bottom: 8px; }
        .inactivity-card p { font-size: 13.5px; color: #64748b; line-height: 1.5; margin-bottom: 20px; }
        .inactivity-timer { font-size: 32px; font-weight: 800; color: #ef4444; margin-bottom: 25px; font-family: monospace; }
        .btn-stay { width: 100%; padding: 16px; background: #4e37b5; color: white; border: none; border-radius: 14px; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s; box-shadow: 0 10px 20px rgba(78,55,181,0.3); }
        .btn-stay:hover { background: #3c2a91; }
    </style>
</head>
<body>

    <!-- INACTIVITY WARNING MODAL -->
    <div id="inactivityModal">
        <div class="inactivity-card">
            <i class="bi bi-clock-history"></i>
            <h2>Inactivity Warning</h2>
            <p>You have been inactive for a while. For your security, your session will automatically expire in:</p>
            <div class="inactivity-timer" id="inactivityCountdown">30</div>
            <button type="button" class="btn-stay" onclick="resetInactivityTimer()">Stay Logged In</button>
        </div>
    </div>

    <div class="radar-container">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
    </div>

    <div class="glass-card">
        <div class="icon-box"><i class="bi bi-geo-alt-fill"></i></div>
        <h2>Emergency Towing</h2>
        <p>Our network is ready. Confirm your pickup location.</p>

        <form id="towForm">
            <input type="text" id="loc" class="location-input" placeholder="Detecting GPS..." required>
            <button class="btn-sos">Request Help Now</button>
        </form>
    </div>

    <script>
        // --- INACTIVITY TIMER LOGIC ---
        let inactivityTimer = null;
        let warningTimer = null;
        let secondsLeft = 30;
        const INACTIVITY_LIMIT = 5 * 60 * 1000; // 5 minutes

        function startInactivityTimer() {
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(showInactivityWarning, INACTIVITY_LIMIT);
        }

        function showInactivityWarning() {
            document.getElementById('inactivityModal').style.display = 'flex';
            secondsLeft = 30;
            document.getElementById('inactivityCountdown').innerText = secondsLeft;

            clearInterval(warningTimer);
            warningTimer = setInterval(() => {
                secondsLeft--;
                document.getElementById('inactivityCountdown').innerText = secondsLeft;
                if (secondsLeft <= 0) {
                    clearInterval(warningTimer);
                    const authInstance = window.firebaseAuthInstance;
                    if(authInstance) {
                        import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js").then(({ signOut }) => {
                            signOut(authInstance).then(() => window.location.href = "{% url 'login' %}");
                        });
                    } else {
                        window.location.href = "{% url 'login' %}";
                    }
                }
            }, 1000);
        }

        window.resetInactivityTimer = function() {
            document.getElementById('inactivityModal').style.display = 'none';
            clearInterval(warningTimer);
            startInactivityTimer();
        };

        ['mousemove', 'mousedown', 'keypress', 'scroll', 'touchstart'].forEach(event => {
            window.addEventListener(event, () => {
                if (document.getElementById('inactivityModal').style.display !== 'flex') {
                    startInactivityTimer();
                }
            }, { passive: true });
        });

        startInactivityTimer();
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCfZ4L9Qf--qXVt6fSTovL6NufC-UEUHv8",
            authDomain: "bimadrive-46fd0.firebaseapp.com",
            databaseURL: "https://bimadrive-46fd0-default-rtdb.firebaseio.com",
            projectId: "bimadrive-46fd0",
            storageBucket: "bimadrive-46fd0.firebasestorage.app",
            messagingSenderId: "672547346096",
            appId: "1:672547346096:android:116a85b7da6254b5b88d75"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        window.firebaseAuthInstance = auth;
        const db = getDatabase(app);

        // Auto populate location placeholder or try geolocation
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((position) => {
                document.getElementById('loc').value = `GPS: ${position.coords.latitude.toFixed(4)}, ${position.coords.longitude.toFixed(4)}`;
            }, () => {
                document.getElementById('loc').value = "Nairobi, Kenya (Default)";
            });
        } else {
            document.getElementById('loc').value = "Nairobi, Kenya (Default)";
        }

        document.getElementById('towForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if (!user) { alert('Please login first'); return; }

            const data = {
                location: document.getElementById('loc').value,
                userId: user.uid,
                type: 'Towing',
                status: 'Dispatched',
                timestamp: new Date().toISOString()
            };

            try {
                const newRef = push(ref(db, 'accidentReports'));
                await set(newRef, data);
                alert('Towing Requested! Help is on the way.');
                window.location.href = "{% url 'client_dashboard' %}";
            } catch (error) {
                console.error(error);
                alert('Error: ' + error.message);
            }
        });
    </script>
</body>
</html>
